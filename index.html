<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Goal Light Control</title>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/paho-mqtt/1.0.1/mqttws31.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/crypto-js/4.1.1/crypto-js.min.js"></script>
    <style>
      body {
        font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        padding: 20px;
        line-height: 1.6;
        max-width: 500px;
        margin: auto;
        background-color: #f4f7f6;
      }
      .card {
        background: white;
        padding: 25px;
        border-radius: 12px;
        box-shadow: 0 10px 25px rgba(0, 0, 0, 0.1);
      }
      .field {
        margin-bottom: 20px;
      }
      label {
        display: block;
        font-weight: bold;
        color: #444;
        margin-bottom: 5px;
      }
      input {
        width: 100%;
        padding: 12px;
        border: 1px solid #ddd;
        border-radius: 6px;
        box-sizing: border-box;
        font-size: 16px;
      }
      input:focus {
        border-color: #007bff;
        outline: none;
        box-shadow: 0 0 0 2px rgba(0, 123, 255, 0.2);
      }
      button {
        background: #28a745;
        color: white;
        padding: 15px;
        border: none;
        border-radius: 6px;
        cursor: pointer;
        width: 100%;
        font-size: 18px;
        font-weight: bold;
        transition: transform 0.1s, background 0.3s;
        margin-bottom: 10px;
      }
      button:active {
        transform: scale(0.98);
      }
      button:hover {
        background: #218838;
      }
      button.secondary {
        background: #6c757d;
      }
      button.secondary:hover {
        background: #5a6268;
      }
      select {
        width: 100%;
        padding: 12px;
        border: 1px solid #ddd;
        border-radius: 6px;
        box-sizing: border-box;
        font-size: 16px;
        background: white;
      }
      select:focus {
        border-color: #007bff;
        outline: none;
        box-shadow: 0 0 0 2px rgba(0, 123, 255, 0.2);
      }
      button.icon {
        width: auto;
        padding: 12px 16px;
        font-size: 16px;
        margin-bottom: 0;
      }
      .toggle-switch {
        position: relative;
        display: inline-block;
        width: 48px;
        height: 26px;
        flex-shrink: 0;
      }
      .toggle-switch input {
        opacity: 0;
        width: 0;
        height: 0;
      }
      .toggle-slider {
        position: absolute;
        cursor: pointer;
        inset: 0;
        background: #ccc;
        border-radius: 26px;
        transition: .3s;
      }
      .toggle-slider:before {
        content: "";
        position: absolute;
        height: 20px;
        width: 20px;
        left: 3px;
        bottom: 3px;
        background: white;
        border-radius: 50%;
        transition: .3s;
      }
      .toggle-switch input:checked + .toggle-slider {
        background: #28a745;
      }
      .toggle-switch input:checked + .toggle-slider:before {
        transform: translateX(22px);
      }
      #status {
        margin-top: 20px;
        padding: 15px;
        border-radius: 6px;
        display: none;
        text-align: center;
        font-weight: bold;
      }
      .badge {
        background: #ffc107;
        padding: 3px 10px;
        border-radius: 20px;
        font-size: 11px;
        float: right;
      }
    </style>
  </head>
  <body>
    <div class="card">
      <span id="mode-badge" class="badge">DEV MODE</span>
      <h2>🚨 Goal Light Control</h2>
      <p style="color: #666; font-size: 0.9em">Update team, configure WiFi, or Update.</p>
      <hr style="border: 0; border-top: 1px solid #eee; margin: 20px 0" />

      <div class="field">
        <label>Team Name</label>
        <select
          id="team_name"
          style="width: 100%; padding: 12px; border-radius: 6px; font-size: 16px"
          onchange="updateAlertsVisibility()"
        >
          <option value="">Select a Team...</option>
          <option value="ALT">-- Alerts Mode --</option>
          <option value="BOS">Boston Bruins</option>
          <option value="BUF">Buffalo Sabres</option>
          <option value="DET">Detroit Red Wings</option>
          <option value="FLA">Florida Panthers</option>
          <option value="MTL">Montreal Canadiens</option>
          <option value="OTT">Ottawa Senators</option>
          <option value="TBL">Tampa Bay Lightning</option>
          <option value="TOR">Toronto Maple Leafs</option>

          <option value="CAR">Carolina Hurricanes</option>
          <option value="CBJ">Columbus Blue Jackets</option>
          <option value="NJD">New Jersey Devils</option>
          <option value="NYI">New York Islanders</option>
          <option value="NYR">New York Rangers</option>
          <option value="PHI">Philadelphia Flyers</option>
          <option value="PIT">Pittsburgh Penguins</option>
          <option value="WSH">Washington Capitals</option>

          <option value="CHI">Chicago Blackhawks</option>
          <option value="COL">Colorado Avalanche</option>
          <option value="DAL">Dallas Stars</option>
          <option value="MIN">Minnesota Wild</option>
          <option value="NSH">Nashville Predators</option>
          <option value="STL">St. Louis Blues</option>
          <option value="UTA">Utah Mammoth</option>
          <option value="WPG">Winnipeg Jets</option>

          <option value="ANA">Anaheim Ducks</option>
          <option value="CGY">Calgary Flames</option>
          <option value="EDM">Edmonton Oilers</option>
          <option value="LAK">Los Angeles Kings</option>
          <option value="SJS">San Jose Sharks</option>
          <option value="SEA">Seattle Kraken</option>
          <option value="VAN">Vancouver Canucks</option>
          <option value="VGK">Vegas Golden Knights</option>
        </select>
      </div>

      <button onclick="sendTeamUpdate()">Update Team</button>

      <div class="field" style="margin-top: 20px;">
        <label>Goal Delay (seconds)</label>
        <div style="display: flex; gap: 8px; align-items: stretch;">
          <input type="number" id="goal_delay" min="0" max="120" placeholder="0" style="flex: 1;" />
          <button class="secondary icon" onclick="sendDelay()">Set</button>
        </div>
        <p style="margin: 4px 0 0; font-size: 0.8em; color: #888;">Delays the score update and goal flash to match your stream.</p>
      </div>

      <div class="field" style="margin-top: 20px; display: flex; justify-content: space-between; align-items: center; gap: 16px;">
        <div>
          <label style="display: block; margin-bottom: 3px;">Power Saving</label>
          <p style="margin: 0; font-size: 0.8em; color: #888;">Off = device never sleeps, shows a dot while idle.</p>
        </div>
        <label class="toggle-switch">
          <input type="checkbox" id="power_saving" checked onchange="sendPowerSave()" />
          <span class="toggle-slider"></span>
        </label>
      </div>

      <hr style="border: 0; border-top: 1px solid #eee; margin: 20px 0" />

      <div id="alerts-section" style="display: none;">
        <div class="field">
          <label>Display Message</label>
          <input type="text" id="scroll_text" placeholder="Text to scroll on display..." maxlength="30" />
        </div>
        <button onclick="sendScrollText()">Send to Display</button>

        <hr style="border: 0; border-top: 1px solid #eee; margin: 20px 0" />
      </div>
      <details style="margin-top: 20px; cursor: pointer">
        <summary style="color: #007bff; font-weight: bold; margin-bottom: 10px">Edit WiFi</summary>

        <div class="field">
          <label>WiFi SSID</label>
          <div style="display: flex; gap: 8px; align-items: stretch;">
            <select id="wifi_ssid" style="flex: 1;">
              <option value="">-- Tap Scan to find networks --</option>
            </select>
            <button class="secondary icon" onclick="requestWifiScan()">Scan</button>
          </div>
        </div>

        <div class="field">
          <label>WiFi Password</label>
          <input type="password" id="wifi_pass" placeholder="Home WiFi Password" />
        </div>

        <button class="secondary" onclick="sendEncryptedWiFi()">Update WiFi Credentials</button>
      </details>
      <details style="margin-top: 20px; cursor: pointer">
        <summary style="color: #007bff; font-weight: bold; margin-bottom: 10px">Advanced</summary>
        <div class="field">
          <label>Device ID</label>
          <input type="text" id="publicID" placeholder="e.g. 8209fb4d..." />
        </div>

        <div class="field" id="secret_field">
          <label>Private Serial</label>
          <input type="password" id="privateSerial" placeholder="Enter Private Serial" />
        </div>
        <div class="field">
          <label>Firmware URL (.bin)</label>
          <input type="text" id="ota_url" placeholder="https://..." />
        </div>
        <button class="secondary" onclick="triggerOTA()">Push Firmware Update</button>
      </details>
      <div id="status"></div>
    </div>

    <script>
      // CONFIG
      const DEV_MODE = false;
      const CREDENTIALS = {
        mqtt_user: 'goallight',
        mqtt_pass: 'cranberryGoal5',
        privateSerial: 'armadillo-paternity-sniff-stonework-silicon-headstone-observant',
      };

      const BROKER = {
        url: '771968717fbb4ca8a42fcb8aab2180b5.s1.eu.hivemq.cloud',
        port: 8884,
        path: '/mqtt',
      };

      function updateAlertsVisibility() {
        const isAlerts = document.getElementById('team_name').value === 'ALT';
        const isPowerSavingOff = !document.getElementById('power_saving').checked;
        document.getElementById('alerts-section').style.display = (isAlerts || isPowerSavingOff) ? 'block' : 'none';
      }

      function fetchDeviceInfo(publicID) {
        if (!publicID) return;

        const cid = 'web_info_' + Math.random().toString(16).substr(2, 5);
        const client = new Paho.MQTT.Client(BROKER.url, BROKER.port, BROKER.path, cid);

        const timer = setTimeout(() => {
          try { client.disconnect(); } catch (e) {}
        }, 10000);

        client.onMessageArrived = (msg) => {
          clearTimeout(timer);
          try {
            const info = JSON.parse(msg.payloadString);
            if (info.team) {
              const sel = document.getElementById('team_name');
              sel.value = info.team;
            }
            if (typeof info.delay === 'number') {
              document.getElementById('goal_delay').value = info.delay;
            }
            if (typeof info.powerSaving === 'boolean') {
              document.getElementById('power_saving').checked = info.powerSaving;
            }
            updateAlertsVisibility();
          } catch (e) {}
          setTimeout(() => { try { client.disconnect(); } catch (e) {} }, 500);
        };

        client.connect({
          useSSL: true,
          userName: CREDENTIALS.mqtt_user,
          password: CREDENTIALS.mqtt_pass,
          onSuccess: () => {
            client.subscribe(`nhl_light/info_result/${publicID}`);
            const msg = new Paho.MQTT.Message('info');
            msg.destinationName = `nhl_light/info/${publicID}`;
            msg.qos = 1;
            client.send(msg);
          },
          onFailure: () => clearTimeout(timer),
        });
      }

      window.onload = () => {
        const params = new URLSearchParams(window.location.search);
        if (params.get('id')) {
          document.getElementById('publicID').value = params.get('id');
          fetchDeviceInfo(params.get('id'));
        }
        if (params.get('secret'))
          document.getElementById('privateSerial').value = params.get('secret');
        if (params.get('ota')) document.getElementById('ota_url').value = params.get('ota');

        if (!DEV_MODE) {
          const b = document.getElementById('mode-badge');
          b.innerText = 'SECURE';
          b.style.background = '#28a745';
          b.style.color = 'white';
        }

        // Also fetch when Device ID is typed/pasted manually
        document.getElementById('publicID').addEventListener('change', (e) => {
          if (e.target.value) fetchDeviceInfo(e.target.value);
        });
      };

      function triggerOTA() {
        const url = document.getElementById('ota_url').value;
        const secret = document.getElementById('privateSerial').value || CREDENTIALS.privateSerial;

        // Sign the URL so the ESP32 knows it's from you
        const signature = CryptoJS.HmacSHA256(url, secret).toString(CryptoJS.enc.Hex);

        const payload = { url: url, signature: signature };
        const publicID = document.getElementById('publicID').value;

        publishMQTT(`ota/${publicID}`, payload, false);
      }

      function showStatus(msg, isError = false) {
        const s = document.getElementById('status');
        s.style.display = 'block';
        s.style.background = isError ? '#f8d7da' : '#d4edda';
        s.style.color = isError ? '#721c24' : '#155724';
        s.innerText = msg;
      }

      function sendTeamUpdate() {
        const publicID = document.getElementById('publicID').value;
        const team = document.getElementById('team_name').value;
        const secret = document.getElementById('privateSerial').value || CREDENTIALS.privateSerial;

        if (!publicID || !team || !secret) {
          showStatus('Missing Device ID, Team Name, or Secret', true);
          return;
        }

        const timestamp = Math.floor(Date.now() / 1000);
        const messageToSign = `${team}:${timestamp}`;
        const signature = CryptoJS.HmacSHA256(messageToSign, secret).toString(CryptoJS.enc.Hex);

        const payload = {
          team_name: team,
          timestamp: timestamp,
          signature: signature,
        };

        publishMQTT(`config/${publicID}`, payload, false);
      }

      function sendEncryptedWiFi() {
        const publicID = document.getElementById('publicID').value;
        const ssid = document.getElementById('wifi_ssid').value;
        const pass = document.getElementById('wifi_pass').value;
        const secret = document.getElementById('privateSerial').value || CREDENTIALS.privateSerial;

        if (!publicID || !ssid || !pass || !secret) {
          showStatus('Missing WiFi details, Device ID, or Secret', true);
          return;
        }

        // Create the JSON payload
        const wifiData = JSON.stringify({ ssid: ssid, pass: pass });

        // Prepare the Key (First 32 bytes of the secret for AES-256)
        const key = CryptoJS.enc.Utf8.parse(secret.substring(0, 32));

        // Encrypt using AES-ECB with PKCS7 padding
        const encrypted = CryptoJS.AES.encrypt(wifiData, key, {
          mode: CryptoJS.mode.ECB,
          padding: CryptoJS.pad.Pkcs7,
        });

        // Convert to Hex string for the ESP32 logic
        const hexPayload = encrypted.ciphertext.toString(CryptoJS.enc.Hex);

        publishMQTT(`config/wifi_update`, hexPayload, true);
      }

      function requestWifiScan() {
        const publicID = document.getElementById('publicID').value;
        if (!publicID) {
          showStatus('Enter Device ID first', true);
          return;
        }

        const select = document.getElementById('wifi_ssid');
        select.innerHTML = '<option value="">Scanning...</option>';
        select.disabled = true;

        const cid = 'web_scan_' + Math.random().toString(16).substr(2, 5);
        const client = new Paho.MQTT.Client(BROKER.url, BROKER.port, BROKER.path, cid);

        const timer = setTimeout(() => {
          select.innerHTML = '<option value="">Scan timed out — try again</option>';
          select.disabled = false;
          try { client.disconnect(); } catch (e) {}
        }, 15000);

        client.onMessageArrived = (msg) => {
          clearTimeout(timer);
          try {
            const networks = JSON.parse(msg.payloadString);
            select.innerHTML = '<option value="">Select a network...</option>';
            networks.forEach((n) => {
              const opt = document.createElement('option');
              opt.value = n.ssid;
              opt.text = `${n.ssid}  (${n.rssi} dBm)`;
              select.appendChild(opt);
            });
            if (networks.length === 0) {
              select.innerHTML = '<option value="">No networks found</option>';
            }
          } catch (e) {
            select.innerHTML = '<option value="">Error reading results</option>';
          }
          select.disabled = false;
          setTimeout(() => { try { client.disconnect(); } catch (e) {} }, 500);
        };

        client.connect({
          useSSL: true,
          userName: CREDENTIALS.mqtt_user,
          password: CREDENTIALS.mqtt_pass,
          onSuccess: () => {
            client.subscribe(`nhl_light/wifi_scan_result/${publicID}`);
            const msg = new Paho.MQTT.Message('scan');
            msg.destinationName = `nhl_light/wifi_scan/${publicID}`;
            msg.qos = 1;
            client.send(msg);
          },
          onFailure: (e) => {
            clearTimeout(timer);
            select.innerHTML = '<option value="">Connection failed</option>';
            select.disabled = false;
            showStatus('Connection Failed: ' + e.errorMessage, true);
          },
        });
      }

      function sendDelay() {
        const publicID = document.getElementById('publicID').value;
        const delay = document.getElementById('goal_delay').value;

        if (!publicID) {
          showStatus('Missing Device ID', true);
          return;
        }
        if (delay === '' || isNaN(delay) || delay < 0) {
          showStatus('Enter a valid delay (0 or more seconds)', true);
          return;
        }

        publishMQTT(`delay/${publicID}`, String(parseInt(delay)), true, `✅ Goal delay set to ${delay}s`);
      }

      function sendPowerSave() {
        const publicID = document.getElementById('publicID').value;
        const enabled = document.getElementById('power_saving').checked;

        if (!publicID) {
          showStatus('Missing Device ID', true);
          document.getElementById('power_saving').checked = !enabled; // revert
          return;
        }

        publishMQTT(
          `powersave/${publicID}`,
          enabled ? '1' : '0',
          true,
          `✅ Power saving ${enabled ? 'enabled' : 'disabled'}`
        );
        updateAlertsVisibility();
      }

      function sendScrollText() {
        const publicID = document.getElementById('publicID').value;
        const text = document.getElementById('scroll_text').value.trim();

        if (!publicID) {
          showStatus('Missing Device ID', true);
          return;
        }
        if (!text) {
          showStatus('Enter some text to display', true);
          return;
        }

        publishMQTT(`scroll/${publicID}`, text, true, `✅ Sent "${text}" to display!`);
      }

      function publishMQTT(subTopic, data, isRaw = false, successMsg = null) {
        const cid = 'web_' + Math.random().toString(16).substr(2, 5);
        const client = new Paho.MQTT.Client(BROKER.url, BROKER.port, BROKER.path, cid);

        client.connect({
          useSSL: true,
          userName: CREDENTIALS.mqtt_user,
          password: CREDENTIALS.mqtt_pass,
          onSuccess: () => {
            const payload = isRaw ? data : JSON.stringify(data);
            const message = new Paho.MQTT.Message(payload);

            message.destinationName = `nhl_light/${subTopic}`;
            message.qos = 1;
            client.send(message);

            if (successMsg) {
              showStatus(successMsg);
            } else if (isRaw) {
              showStatus('✅ Encrypted WiFi Credentials Sent!');
            } else {
              showStatus(`✅ Team update sent for ${data.team_name}!`);
            }

            setTimeout(() => client.disconnect(), 1000);
          },
          onFailure: (e) => showStatus('Connection Failed: ' + e.errorMessage, true),
        });
      }
    </script>
  </body>
</html>
