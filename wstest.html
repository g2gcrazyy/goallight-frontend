<!doctype html>
<html><head><meta charset="utf-8"><title>WS test</title>
<style>body{font:20px system-ui;padding:24px}pre{font-size:22px}</style></head>
<body>
<h2>GoalLight WebSocket transport test</h2>
<pre id="out">testing… (wait ~8 seconds)</pre>
<script>
  var res = {};
  function mk(port){
    try{
      var w = new WebSocket("wss://goallight.duckdns.org:"+port+"/mqtt", "mqtt");
      w.onopen  = function(){ if(!res[port]) res[port]="✅ CONNECTED"; try{w.close();}catch(e){} };
      w.onclose = function(e){ if(!res[port]) res[port]="❌ closed (code "+e.code+")"; render(); };
      w.onerror = function(){ if(!res[port]) res[port]="❌ error"; render(); };
    }catch(e){ res[port]="❌ exception "+e; }
  }
  function render(){
    document.getElementById('out').textContent =
      "Port 8884 (direct Mosquitto):  " + (res[8884]||"… waiting") + "\n" +
      "Port 443  (via nginx):         " + (res[443] ||"… waiting");
  }
  mk(8884); mk(443);
  setTimeout(function(){
    if(!res[8884]) res[8884]="❌ HANG / no response";
    if(!res[443])  res[443] ="❌ HANG / no response";
    render();
  }, 8000);
  setInterval(render, 1000);
</script>
</body></html>
